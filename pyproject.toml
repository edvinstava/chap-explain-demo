[project]
name = "chap-explain-demo"
version = "0.1.0"
description = "CHAP demo model with SHAP and LIME explanation outputs for visualization research"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Edvin Stava" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "lime>=0.2",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
plots = [
    "matplotlib>=3.8",
]

[tool.uv]
package = false
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
